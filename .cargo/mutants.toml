# cargo-mutants configuration (TL-231). Run with `make mutants` or
# `make mutants-diff`; see docs/verification-tooling.md for the budgets.
#
# Mutants in CI-plumbing modules are excluded from every threshold: those
# modules gate the build, not the MLTL logic, and inflate the score.
exclude_globs = [
    "src/ci_guard.rs",
    "src/bin/ci_guard.rs",
    # Process-spawning drivers (cargo kani, libFuzzer binaries); their pure parts are unit-tested but
    # a mutant of the spawn and wait loops needs the external tool to observe.
    "src/bin/kani_gate.rs",
    "src/bin/fuzz_campaign.rs",
    # Verifier-only (cfg(kani)); never compiled by cargo test.
    "src/future/kani_evaluate.rs",
    "src/wire/kani_wire.rs",
]

# The infinite-trace provider is behind a feature; mutate it with the tests
# that exercise it.
additional_cargo_args = ["--all-features"]

# The unmutated suite takes minutes under load; the floor is well above it so a loaded host does not
# turn a caught mutant into a timeout.
minimum_test_timeout = 300
timeout_multiplier = 3.0

# Equivalent mutants (one-line reason each).
exclude_re = [
    # The inline cfg(kani) harness in horizon.rs is never compiled by cargo test, so no test can observe a mutation of it.
    "replace kani_proofs::horizon_bound_addition_matches_checked_add with",
]

# tests/tc138_feature_boundary.rs rebuilds the crate for external consumers and takes 12 minutes under
# load; it checks feature gating, which no mutant changes, and as the slowest test it turned every
# surviving mutant into a timeout. Mutation runs skip it.
additional_cargo_test_args = ["--", "--skip", "external_consumer_feature_tree_and_complete_bounded_bytes"]
