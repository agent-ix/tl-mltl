name: CI

# Manual dispatch only, deliberately. There is no push or pull_request trigger:
# local `make guarded-ci` is the iteration gate, and a hosted run is dispatched
# once for a finalized revision so parallel pull-request work does not generate
# repeated billable runs.
on:
  workflow_dispatch:

jobs:
  msrv:
    name: Rust 1.98.1 Feature Boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check library, CLI, examples, and integration tests
        run: cargo check --locked --all-targets --all-features

  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `make msrv` runs cargo through this toolchain, and the MSRV attestation
      # observes its version. Without it installed, `make ci` cannot run.
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install the public-registry versions classified by the pinned
      # Engineering Assurance compatibility matrix. Historical repins are
      # retained in assurance/pins.json.
      - name: Install specification tools and modules
        run: |
          npm install --global '@agent-ix/quire-cli@0.33.0' '@agent-ix/quoin@0.24.1' '@agent-ix/ix-flow@0.2.3'
          quoin module ensure-defaults
          quoin module install github:agent-ix/engineering-assurance//engineering_assurance@v0.3.2

      - name: Install pinned Engineering Assurance classifier
        run: cargo +1.98.1 install --git https://github.com/agent-ix/engineering-assurance --tag v0.3.2 --locked --bin engineering-assurance

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `make ci` includes the verifier-only proof so a private-symbol rename
      # cannot silently detach it. This workflow is dispatch-only; install the
      # pinned verifier before invoking that aggregate.
      - name: Install Kani
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          # The action otherwise runs `cargo kani` itself. Provision the
          # verifier with a no-op command; the aggregate below invokes the
          # canonical `make kani-check` recipe exactly once.
          command: 'true'

      # The assured entry point (NFR-006): refuses to invoke Make at all if
      # this repository's Makefile text or the runner's invocation
      # environment could suppress prerequisite-failure propagation, and
      # reconciles the gates that actually completed against the declared
      # `ci` prerequisite set, independent of Make's own exit code. A bare
      # `make ci` here would trust Make's own execution controls and exit
      # code exactly as before.
      - name: Complete local gate (guarded)
        run: make guarded-ci

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny policy
        run: cargo deny check licenses sources
