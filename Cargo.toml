[package]
name = "tl-mltl"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Finite-trace MLTL evaluation, horizon analysis, and runtime-monitor interoperability."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-mltl"
build = "build.rs"

[lib]
name = "tl_mltl"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tl-syntax = { git = "https://github.com/agent-ix/tl-syntax.git", rev = "1b3c4026ff9567491e87a19fdf2793d3b2e76160", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
serde_yaml_ng = "0.10"
proptest = "=1.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
