[package]
name = "tl-mltl"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.1"
description = "Finite-trace MLTL evaluation, horizon analysis, and runtime-monitor interoperability."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT"
publish = false
repository = "https://github.com/agent-ix/tl-mltl"
build = "build.rs"

[features]
default = []
infinite-trace = []

[lib]
name = "tl_mltl"
path = "src/lib.rs"

[[example]]
name = "v1_live_r2u2"
required-features = ["infinite-trace"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "9de638dc4d14d0ae62a6825473a3a9bb6a9e57ac", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
serde_yaml_ng = "0.10"
proptest = "=1.5.0"
tempfile = "=3.10.1"
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "98dc75727ecbfd465e09649b79cf105fc69b4c6b" }

[[bench]]
name = "v9_workloads"
harness = false
required-features = ["infinite-trace"]

[profile.release]
lto = "thin"
codegen-units = 1
