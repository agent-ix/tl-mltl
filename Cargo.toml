[package]
name = "tl-mltl"
version = "0.4.1"
edition = "2021"
rust-version = "1.98.1"
description = "Finite-trace MLTL evaluation, horizon analysis, and runtime-monitor interoperability."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-mltl"
build = "build.rs"

[features]
default = []
infinite-trace = []

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[lib]
name = "tl_mltl"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
# UNBUILT-PIN: a80d09e is tl-syntax origin/main on 2026-11-23. The unbuilt TL-149/150/151
# code needs SignalPartition (FR-034), the LTLf NodeKind variants and profile (FR-332/333);
# replace with the merged tl-syntax rev that carries them, then refresh Cargo.lock.
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "a80d09e", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
proptest = "=1.5.0"
tempfile = "=3.10.1"
tl-oracle = { version = "=0.1.1", git = "https://github.com/agent-ix/tl-oracle.git", tag = "v0.1.1" }

[profile.release]
lto = "thin"
codegen-units = 1
