[package]
name = "tl-mltl"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Finite-trace MLTL evaluation, horizon analysis, and runtime-monitor interoperability."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-mltl"
build = "build.rs"

[lib]
name = "tl_mltl"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tl-syntax = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "842d82553f045eb69a7f38745756d968254fc25e", default-features = false, features = ["alloc", "serde"] }
quire-observation = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-observation", rev = "7dcfe2c95909249ee179a27cddc2e3a4f8d93120" }

[dev-dependencies]
agent-ix-baseline-producer = { version = "=0.0.0", git = "https://github.com/agent-ix/filament-core-data", rev = "404288282402d60de007295ccbafa960532b955e" }
serde_yaml_ng = "0.10"
proptest = "=1.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
