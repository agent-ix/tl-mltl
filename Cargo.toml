[package]
name = "tl-mltl"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.1"
description = "Finite-trace MLTL evaluation, horizon analysis, and runtime-monitor interoperability."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT"
publish = false
repository = "https://github.com/agent-ix/tl-mltl"
build = "build.rs"

[features]
default = []
infinite-trace = []

[lib]
name = "tl_mltl"
path = "src/lib.rs"

[[example]]
name = "v1_live_r2u2"
required-features = ["infinite-trace"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "b923fd4fdf2a2bafe66fe7d20f951e50bea2210f", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
serde_yaml_ng = "0.10"
proptest = "=1.5.0"
tempfile = "=3.10.1"
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "6e7056fb940f7173a66bced33f9e5b68980de35b" }

[[bench]]
name = "v9_workloads"
harness = false
required-features = ["infinite-trace"]

[profile.release]
lto = "thin"
codegen-units = 1
