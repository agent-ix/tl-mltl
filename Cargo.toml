[package]
name = "tl-mltl"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Finite-trace MLTL evaluation, horizon analysis, and runtime-monitor interoperability."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-mltl"
build = "build.rs"

[lib]
name = "tl_mltl"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tl-syntax = { git = "https://github.com/agent-ix/tl-syntax.git", rev = "953ee825e5060335b4c79682f5f41a78c5a1bfae", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
