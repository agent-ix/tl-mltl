[package]
name = "tl-mltl"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.1"
description = "Finite-trace MLTL evaluation, horizon analysis, and runtime-monitor interoperability."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-mltl"
build = "build.rs"

[features]
default = []
infinite-trace = []

[lib]
name = "tl_mltl"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "5ced12e22917c56bb2ebd161a3e519cddf7a668a", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
serde_yaml_ng = "0.10"
proptest = "=1.5.0"
tempfile = "=3.10.1"

[profile.release]
lto = "thin"
codegen-units = 1
