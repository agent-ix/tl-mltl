[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Exact owner revision is pinned in Cargo.toml and Cargo.lock.
allow-git = [
    "https://github.com/agent-ix/tl-syntax.git",
    "https://github.com/agent-ix/tl-oracle.git",
]
