[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Exact owner revisions are pinned in Cargo.toml and Cargo.lock. The TL owner
# imports Quire Observation's constructor-private views instead of copying its
# wire vocabulary.
allow-git = [
    "https://github.com/agent-ix/tl-syntax.git",
    "https://github.com/agent-ix/quire-observation",
]
