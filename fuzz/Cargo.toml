[package]
name = "tl-mltl-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
serde_json = "=1.0.151"
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "4b3034add7d46035f9193375fe2fe19957bebb5b" }
sha2 = "=0.10.9"
tl-mltl = { path = "..", features = ["infinite-trace"] }
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "af70b920fe8a39c28031b0084cc868012c47441f", default-features = false, features = ["alloc", "serde"] }

[[bin]]
name = "c2po_map"
path = "fuzz_targets/c2po_map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evaluator_differential"
path = "fuzz_targets/evaluator_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_cli_decode"
path = "fuzz_targets/wire_cli_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "history_intake"
path = "fuzz_targets/history_intake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lasso_differential"
path = "fuzz_targets/lasso_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "partial_valuation_monotone"
path = "fuzz_targets/partial_valuation_monotone.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
