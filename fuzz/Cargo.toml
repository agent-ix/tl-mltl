[package]
name = "tl-mltl-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
serde_json = "=1.0.151"
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", tag = "v0.1.0" }
sha2 = "=0.10.9"
tl-mltl = { path = "..", features = ["infinite-trace"] }
# Same source spec as ../Cargo.toml so one tl-syntax crate is built (it was a separate
# tag before, which made the target's Formula a different type from tl-mltl's).
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "a80d09e", default-features = false, features = ["alloc", "serde"] }

[[bin]]
name = "c2po_map"
path = "fuzz_targets/c2po_map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evaluator_differential"
path = "fuzz_targets/evaluator_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_cli_decode"
path = "fuzz_targets/wire_cli_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "history_intake"
path = "fuzz_targets/history_intake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lasso_differential"
path = "fuzz_targets/lasso_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "partial_valuation_monotone"
path = "fuzz_targets/partial_valuation_monotone.rs"
test = false
doc = false
bench = false

# UNBUILT-PIN: local sibling worktree; replace by the merged tl-syntax rev.
[patch."https://github.com/agent-ix/tl-syntax.git"]
tl-syntax = { path = "../../TL-code-tl-syntax" }

[workspace]
members = ["."]
