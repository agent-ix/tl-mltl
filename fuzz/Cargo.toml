[package]
name = "tl-mltl-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sha2 = "=0.10.9"
tl-mltl = { path = "..", features = ["infinite-trace"] }
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "9de638dc4d14d0ae62a6825473a3a9bb6a9e57ac", default-features = false, features = ["alloc", "serde"] }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "98dc75727ecbfd465e09649b79cf105fc69b4c6b" }

[[bin]]
name = "c2po_map"
path = "fuzz_targets/c2po_map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "closed_eval"
path = "fuzz_targets/closed_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lasso_differential"
path = "fuzz_targets/lasso_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "partial_valuation_monotone"
path = "fuzz_targets/partial_valuation_monotone.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
