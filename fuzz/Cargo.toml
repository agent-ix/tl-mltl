[package]
name = "tl-mltl-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "=1.4.2"
libfuzzer-sys = "0.4"
sha2 = "=0.10.9"
serde_json = "=1.0.151"
tl-mltl = { path = "..", features = ["infinite-trace"] }
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "6aa9b11e29040d64b437da87c9944e3dedd34a86", default-features = false, features = ["alloc", "serde"] }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "2391e5b7402ae02e8d138f3901b43a1f07acd1b6" }

[[bin]]
name = "c2po_map"
path = "fuzz_targets/c2po_map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "closed_eval"
path = "fuzz_targets/closed_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_cli_decode"
path = "fuzz_targets/wire_cli_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trace_history_intake"
path = "fuzz_targets/trace_history_intake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "finite_oracle_differential"
path = "fuzz_targets/finite_oracle_differential.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
