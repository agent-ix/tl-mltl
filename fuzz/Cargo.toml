[package]
name = "tl-mltl-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sha2 = "=0.10.9"
tl-mltl = { path = "..", features = ["infinite-trace"] }
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "43dcd3646d14922e20dee1be17b258be00ebf027", default-features = false, features = ["alloc", "serde"] }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "b767e13a36980c98686223965b6f71516d64246d" }

[[bin]]
name = "c2po_map"
path = "fuzz_targets/c2po_map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "closed_eval"
path = "fuzz_targets/closed_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lasso_differential"
path = "fuzz_targets/lasso_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "partial_valuation_monotone"
path = "fuzz_targets/partial_valuation_monotone.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
