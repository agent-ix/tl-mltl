# Kill-rate thresholds checked by tl-gate gate (TL-231).
# Kill rate = caught / (caught + missed + timeout); unviable mutants count on
# neither side. `min_kill_percent` is the measured baseline floor (a ratchet:
# raise it when survivors are killed, never lower it). The campaign targets are
# 95% for the core group and 85% for the whole crate; a group whose floor is
# below its target has recorded survivors listed in docs/verification-tooling.md.
# `diff_min_kill_percent` applies to `make mutants-diff`: every mutant in the
# changed code must be killed.
diff_min_kill_percent = 100.0
exclude = ["src/ci_guard.rs", "src/bin/ci_guard.rs", "src/bin/kani_gate.rs", "src/bin/fuzz_campaign.rs", "src/future/kani_evaluate.rs", "src/wire/kani_wire.rs"]

# evaluation, horizon, interval arithmetic
[[group]]
name = "evaluator-core"
globs = ["src/future/*.rs"]
min_kill_percent = 95.0

# whole crate
[[group]]
name = "crate"
globs = ["src/*.rs", "src/*/*.rs"]
min_kill_percent = 83.0
